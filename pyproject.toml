[project]
name = "entity_normalization"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "pronto",
  "rank-bm25",
  "rapidfuzz",
  "transformers>=4.40,<5",
  "sentence-transformers",  "torch",
  "tqdm",
  "orjson>=3.11.8",
  "scikit-learn>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
